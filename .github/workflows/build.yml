# Builds the Mac .dmg (Apple Silicon + Intel) and Windows .exe installers in the cloud and
# attaches them to a GitHub Release.  Free for public repositories.  The app's built-in
# update check reads these releases, so publishing a new tag = an update for the user.
#
# To release:  git tag v0.2.1 && git push --tags
# ...or just use the "Run workflow" button on the Actions tab (workflow_dispatch) -
# electron-builder will create the matching tag/release itself from app/package.json's version.
name: build-installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets electron-builder's --publish step create the Release/tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon runner
            target: mac-arm64
            # ulimit raised because code-signing (now that we actually sign, see below) has to
            # open every file in the bundle - torch's site-packages alone has thousands of small
            # files, enough to hit the default per-process open-file limit (EMFILE) mid-sign.
            # --publish never: this job only builds the file locally. Three matrix jobs each
            # trying to publish at the same time is exactly what was creating two different
            # GitHub Releases under the same tag (assets split between them, neither complete).
            # Only the single publish-release job below (which runs after all three finish)
            # touches the Releases API now, so there is nothing left to race.
            cmd: ulimit -n 10240 && npx electron-builder --mac --arm64 --publish never
          - os: macos-14      # macos-13 (Intel) runners are capacity-constrained/retiring; electron-builder
            target: mac-x64   # cross-packages the x64 build fine from an arm64 host, no Rosetta needed.
            # Pinned to the exact Electron version already confirmed working, independent of
            # whatever the "electron" devDependency range resolves to later. macOS 27 "Golden
            # Gate" drops Intel Mac support entirely (Tahoe/26 is the last Intel release), so an
            # Electron bump made for the arm64/Windows builds down the line could quietly raise
            # the minimum macOS version past what an Intel Mac can ever reach again - stranding
            # Intel users on an app they can't update. Revisit this pin deliberately, not as a
            # side effect of bumping Electron for everyone else.
            cmd: ulimit -n 10240 && npx electron-builder --mac --x64 --publish never --config.electronVersion=33.4.11
          - os: windows-latest
            target: win-x64
            cmd: npx electron-builder --win --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bundle Python runtime + FFmpeg
        run: python scripts/bundle_runtime.py --target ${{ matrix.target }}
      - name: Install Electron
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build and publish installer
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # we set identity explicitly (ad-hoc); skip keychain search
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  # The three builds above now only build their installer file (--publish never) and hand it
  # off as a plain workflow artifact. This job runs once, after ALL three have finished, and is
  # the ONLY thing that ever talks to the GitHub Releases API - so there's nothing left for it
  # to race against. It also works whichever way the run was started: a real `git push --tags`
  # (where the release doesn't exist yet) or a manual "Run workflow" click, and it won't choke
  # if someone's already hand-created a draft/published release for this version first - it just
  # uploads the files to whichever one exists, or creates a fresh one if none does.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the installers all three builds produced
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish one release with every file attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          echo "Files collected from the three builds:"
          ls -la dist
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists (e.g. hand-created in the web UI) - attaching files to it."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --draft=false --latest --repo "$REPO"
          else
            echo "No release for $TAG yet - creating it fresh, anchored to this exact commit."
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes \
              --target "${{ github.sha }}" --repo "$REPO"
          fi
