# Builds the Mac .dmg (Apple Silicon + Intel) and Windows .exe installers in the cloud and
# attaches them to a GitHub Release.  Free for public repositories.  The app's built-in
# update check reads these releases, so publishing a new tag = an update for the user.
#
# To release:  git tag v0.2.1 && git push --tags
# ...or just use the "Run workflow" button on the Actions tab (workflow_dispatch) -
# electron-builder will create the matching tag/release itself from app/package.json's version.
name: build-installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets electron-builder's --publish step create the Release/tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon runner
            target: mac-arm64
            cmd: npx electron-builder --mac --arm64 --publish always
          - os: macos-14      # macos-13 (Intel) runners are capacity-constrained/retiring; electron-builder
            target: mac-x64   # cross-packages the x64 build fine from an arm64 host, no Rosetta needed.
            # Pinned to the exact Electron version already confirmed working, independent of
            # whatever the "electron" devDependency range resolves to later. macOS 27 "Golden
            # Gate" drops Intel Mac support entirely (Tahoe/26 is the last Intel release), so an
            # Electron bump made for the arm64/Windows builds down the line could quietly raise
            # the minimum macOS version past what an Intel Mac can ever reach again - stranding
            # Intel users on an app they can't update. Revisit this pin deliberately, not as a
            # side effect of bumping Electron for everyone else.
            cmd: npx electron-builder --mac --x64 --publish always --config.electronVersion=33.4.11
          - os: windows-latest
            target: win-x64
            cmd: npx electron-builder --win --x64 --publish always
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bundle Python runtime + FFmpeg
        run: python scripts/bundle_runtime.py --target ${{ matrix.target }}
      - name: Install Electron
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build and publish installer
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code signing
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  # electron-builder always files a draft release when it isn't itself triggered by a real
  # tag push (workflow_dispatch has no tag ref). Publishing that draft from the web UI's
  # "Publish release" button has been failing ("Make sure you have a valid tag") - something
  # about this repo blocks ad-hoc tag creation for the logged-in user, the same restriction
  # that rejected a `git push <tag>` from outside earlier. The Actions token isn't subject to
  # that block (it already created the draft releases fine), so let it finish the job: un-draft
  # the release here, which makes GitHub materialise the real vX.Y.Z tag at the same time.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release GitHub Actions just built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          gh release edit "v$VERSION" --draft=false --latest --repo "${{ github.repository }}"
